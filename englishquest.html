
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Quest</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;min-height:100vh;padding:20px;
 display:grid;place-items:center;
 font-family:Arial;color:white;
 background:linear-gradient(135deg,#101633,#263c80,#512e82);
}
.card{
 width:min(700px,100%);padding:25px;
 background:#151e42;border:1px solid #6376c0;
 border-radius:22px;box-shadow:0 15px 50px #0008;
}
h1{text-align:center;color:#8ef5dc}
p{text-align:center;color:#c4d0ff}
button{
 cursor:pointer;border:0;border-radius:12px;
 padding:15px;background:#344b91;color:white;
 font-size:16px;font-weight:bold;
}
button:hover{background:#526bc0}
.modes,.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.answers button{text-align:left}
#question{font-size:23px;margin:25px 0}
#info{padding:15px;background:#26345f;border-radius:12px;min-height:55px;margin:15px 0}
#next{background:#52d9b8;color:#10213b;width:100%}
#next:disabled{opacity:.4}
#game,#result{display:none}
#bar{height:8px;background:#29345f;border-radius:10px;margin:20px 0}
#progress{height:8px;width:0;background:#52e0c4;border-radius:10px}
@media(max-width:480px){.modes,.answers{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="card">
<h1>🎮 ENGLISH QUEST</h1>
<p>Проверь свои знания английского языка!</p>

<div id="menu">
 <div class="modes">
  <button onclick="start('all')">🚀 Все темы</button>
  <button onclick="start('present')">⚡ Present Simple</button>
  <button onclick="start('this')">📦 This / That</button>
  <button onclick="start('poss')">💡 My / Your / His...</button>
 </div>
</div>

<div id="game">
 <p id="counter"></p>
 <div id="bar"><div id="progress"></div></div>
 <p id="topic"></p>
 <div id="question"></div>
 <div class="answers" id="answers"></div>
 <div id="info">Выбери ответ!</div>
 <p>⭐ Очки: <b id="score">0</b></p>
 <button id="next" onclick="next()" disabled>Следующий вопрос →</button>
 <button onclick="home()" style="margin-top:10px;width:100%">В меню</button>
</div>

<div id="result">
 <h1>🏆 Игра окончена!</h1>
 <h2 id="points" style="text-align:center"></h2>
 <p id="message"></p>
 <button onclick="home()" style="width:100%">Играть снова</button>
</div>
</div>

<script>
const data=[
['present','Present Simple','I ___ a family.',['has','have','haves'],1,'С I используется have.'],
['present','Present Simple','He ___ to school.',['go','goes','gos'],1,'Go превращается в goes.'],
['present','Present Simple','She ___ this mistake.',['see','sees','seeing'],1,'С she добавляем -s.'],
['present','Present Simple','They often ___ to the cinema.',['go','goes','going'],0,'С they используется обычный глагол.'],
['present','Present Simple','He ___ this thing.',['know','knows','knowing'],1,'С he добавляем -s.'],
['present','Present Simple','She ___ it very well.',['do','does','dos'],1,'Do превращается в does.'],
['present','Present Simple','It ___ interesting.',['look','looks','looking'],1,'С it добавляем -s.'],
['present','Present Simple','He ___ an idea.',['have','has','haves'],1,'Have превращается в has.'],
['present','Present Simple','We ___ it often.',['do','does','doing'],0,'С we используется do.'],
['present','Present Simple','He / She / It + глагол...',['-s','-ed','-ing'],0,'Обычно добавляем -s или -es.'],

['this','This / These','I see ___ mistake.',['this','these','those'],0,'This — один предмет рядом.'],
['this','This / These','I see ___ mistakes.',['this','these','that'],1,'These — несколько предметов рядом.'],
['this','That / Those','I understand ___ person.',['those','that','these'],1,'That — один человек далеко.'],
['this','That / Those','I understand ___ people.',['that','those','this'],1,'Those — несколько людей далеко.'],
['this','This / These','Что означает These?',['Этот','Эти','Тот'],1,'These означает «эти».'],

['poss','Possessive words','I → ___',['my','his','our'],0,'I — my.'],
['poss','Possessive words','We → ___',['your','our','their'],1,'We — our.'],
['poss','Possessive words','You → ___',['your','my','her'],0,'You — your.'],
['poss','Possessive words','They → ___',['their','his','our'],0,'They — their.'],
['poss','Possessive words','He → ___',['her','his','its'],1,'He — his.'],
['poss','Possessive words','She → ___',['his','her','their'],1,'She — her.'],
['poss','Possessive words','It → ___',['its','our','your'],0,'It — its.']
];

let questions=[],index=0,score=0,locked=false,mode='all';

function start(m){
 mode=m;
 let pool=m==='all'?data:data.filter(q=>q[0]===m);
 questions=pool.sort(()=>Math.random()-.5).slice(0,10);
 index=0;score=0;
 document.getElementById('score').textContent=0;
 document.getElementById('menu').style.display='none';
 document.getElementById('result').style.display='none';
 document.getElementById('game').style.display='block';
 show();
}

function show(){
 locked=false;
 let q=questions[index];
 document.getElementById('counter').textContent=
 'Вопрос '+(index+1)+' из '+questions.length;
 document.getElementById('progress').style.width=
 (index/questions.length*100)+'%';
 document.getElementById('topic').textContent=q[1];
 document.getElementById('question').textContent=q[2];
 document.getElementById('info').textContent='Выбери правильный ответ!';
 let next=document.getElementById('next');
 next.disabled=true;
 next.textContent=index===questions.length-1?'Результат 🏆':'Следующий вопрос →';

 let box=document.getElementById('answers');
 box.innerHTML='';
 q[3].forEach((answer,i)=>{
  let b=document.createElement('button');
  b.textContent=answer;
  b.onclick=()=>check(i);
  box.appendChild(b);
 });
}

function check(choice){
 if(locked)return;
 locked=true;
 let q=questions[index];
 let buttons=document.querySelectorAll('#answers button');

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q[4])b.style.background='#16805d';
  else if(i===choice)b.style.background='#a33c60';
 });

 if(choice===q[4]){
  score+=10;
  document.getElementById('info').textContent='✅ Правильно! '+q[5];
 }else{
  document.getElementById('info').textContent=
  '❌ Правильный ответ: '+q[3][q[4]]+'. '+q[5];
 }
 document.getElementById('score').textContent=score;
 document.getElementById('next').disabled=false;
}

function next(){
 if(!locked)return;
 index++;
 if(index<questions.length){show();return}
 finish();
}

function finish(){
 document.getElementById('game').style.display='none';
 document.getElementById('result').style.display='block';
 document.getElementById('points').textContent=score+' / 100';
 document.getElementById('message').textContent=
 score===100?'Отлично! Все ответы правильные! 🎉':
 score>=70?'Очень хорошо! Продолжай тренироваться!':
 score>=40?'Неплохо! Повтори правила и попробуй ещё раз.':
 'Повтори урок и попробуй снова! Ты сможешь!';
}

function home(){
 document.getElementById('game').style.display='none';
 document.getElementById('result').style.display='none';
 document.getElementById('menu').style.display='block';
}
</script>
</body>
</html>
