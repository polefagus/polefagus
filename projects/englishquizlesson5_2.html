<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>English Master 5.2 🎮</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 50%, #f093fb 100%);
    background-size: 400% 400%;
    animation: gradientShift 15s ease infinite;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 10px; overflow-x: hidden;
  }
  @keyframes gradientShift {
    0%,100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .app {
    width: 100%; max-width: 620px;
    background: rgba(255,255,255,0.97);
    border-radius: 24px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    padding: 22px;
    position: relative; overflow: hidden;
  }
  .app::before {
    content:''; position:absolute; top:-50%; right:-50%;
    width:200%; height:200%;
    background: radial-gradient(circle, rgba(118,75,162,0.08) 0%, transparent 70%);
    pointer-events:none;
  }
  h1 {
    text-align:center; font-size:1.7rem; margin-bottom:6px;
    background: linear-gradient(90deg,#667eea,#f093fb,#764ba2);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; font-weight:800;
  }
  .subtitle { text-align:center; color:#888; font-size:0.82rem; margin-bottom:16px; }

  /* --- START SCREEN --- */
  .screen { position:relative; z-index:1; }
  .start-card { text-align:center; padding:10px 0; }
  .emoji-big { font-size:3.5rem; animation: bounce 2s infinite; }
  @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-12px)} }
  .modes { display:flex; flex-direction:column; gap:10px; margin-top:18px; }
  .mode-btn {
    padding:16px; border:none; border-radius:16px; cursor:pointer;
    font-size:1rem; font-weight:700; color:#fff;
    background: linear-gradient(135deg,#667eea,#764ba2);
    box-shadow: 0 6px 20px rgba(102,126,234,0.4);
    transition: transform 0.15s, box-shadow 0.15s;
    display:flex; align-items:center; justify-content:center; gap:8px;
  }
  .mode-btn:active { transform: scale(0.97); }
  .mode-btn.alt { background: linear-gradient(135deg,#f093fb,#f5576c); box-shadow:0 6px 20px rgba(245,87,108,0.4); }
  .mode-btn.alt2 { background: linear-gradient(135deg,#4facfe,#00f2fe); box-shadow:0 6px 20px rgba(79,172,254,0.4); }

  /* --- HUD --- */
  .hud { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; gap:8px; }
  .hud-item {
    background:#f5f6ff; padding:8px 12px; border-radius:12px;
    font-size:0.78rem; font-weight:700; color:#555; display:flex; align-items:center; gap:5px;
    min-width:0;
  }
  .hud-item .val { color:#764ba2; font-size:0.95rem; }
  .lives { color:#f5576c; font-size:1rem; letter-spacing:1px; }

  .progress-bar { height:8px; background:#eee; border-radius:10px; overflow:hidden; margin-bottom:18px; }
  .progress-fill {
    height:100%; width:0%; border-radius:10px;
    background: linear-gradient(90deg,#667eea,#f093fb);
    transition: width 0.4s ease;
  }

  /* --- QUESTION --- */
  .q-card {
    background: linear-gradient(135deg,#f8f9ff,#eef1ff);
    border-radius:18px; padding:24px 18px; margin-bottom:16px;
    text-align:center; min-height:120px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    border:2px solid #e8ecff; position:relative;
  }
  .q-label { font-size:0.72rem; color:#9aa; text-transform:uppercase; letter-spacing:1.5px; margin-bottom:8px; font-weight:700; }
  .q-text { font-size:1.25rem; font-weight:700; color:#2d2d4a; line-height:1.4; word-break:break-word; }
  .speak-btn {
    margin-top:12px; background:#764ba2; color:#fff; border:none;
    border-radius:50%; width:42px; height:42px; font-size:1.1rem; cursor:pointer;
    box-shadow:0 4px 12px rgba(118,75,162,0.4); transition:transform 0.15s;
  }
  .speak-btn:active { transform:scale(0.9); }

  /* --- ANSWERS --- */
  .answers { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  @media (max-width:480px){ .answers { grid-template-columns:1fr; } }
  .ans-btn {
    padding:15px 12px; border:2px solid #e0e4ff; border-radius:14px;
    background:#fff; font-size:0.92rem; font-weight:600; color:#333;
    cursor:pointer; transition: all 0.18s; line-height:1.3;
    font-family:inherit; text-align:center; word-break:break-word;
  }
  .ans-btn:hover:not(:disabled){ border-color:#667eea; background:#f5f7ff; }
  .ans-btn:active:not(:disabled){ transform:scale(0.97); }
  .ans-btn.correct { background:#d4f8d4; border-color:#4caf50; color:#2e7d32; animation:pop 0.4s; }
  .ans-btn.wrong { background:#ffd6d6; border-color:#f44336; color:#c62828; animation:shake 0.4s; }
  .ans-btn:disabled { cursor:default; opacity:0.9; }
  @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.06)} 100%{transform:scale(1)} }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }

  /* --- COMBO --- */
  .combo-badge {
    position:absolute; top:10px; right:10px;
    background: linear-gradient(135deg,#ff9a56,#ff6a88);
    color:#fff; font-weight:800; font-size:0.75rem;
    padding:5px 10px; border-radius:20px;
    animation: pop 0.4s; box-shadow:0 4px 12px rgba(255,106,136,0.5);
  }

  /* --- FEEDBACK --- */
  .feedback {
    text-align:center; margin-top:14px; font-weight:700; font-size:0.95rem;
    min-height:22px; color:#666; transition:all 0.3s;
  }
  .feedback.good { color:#2e7d32; }
  .feedback.bad { color:#c62828; }

  /* --- HINT BTN --- */
  .hint-row { display:flex; gap:10px; margin-top:14px; }
  .hint-btn {
    flex:1; padding:12px; border:none; border-radius:12px; cursor:pointer;
    background: linear-gradient(135deg,#ffb347,#ffcc33); color:#5a3e00;
    font-weight:700; font-size:0.85rem; transition:transform 0.15s;
    font-family:inherit;
  }
  .hint-btn:active { transform:scale(0.97); }
  .hint-btn:disabled { opacity:0.4; cursor:default; }

  /* --- RESULT --- */
  .result-card { text-align:center; padding:10px 0; }
  .result-emoji { font-size:4rem; animation:bounce 1.5s infinite; }
  .result-title { font-size:1.5rem; font-weight:800; color:#2d2d4a; margin:10px 0; }
  .result-stats { display:flex; justify-content:center; gap:16px; flex-wrap:wrap; margin:16px 0; }
  .stat-box { background:#f5f6ff; border-radius:14px; padding:14px 20px; min-width:90px; }
  .stat-box .num { font-size:1.6rem; font-weight:800; color:#764ba2; }
  .stat-box .lbl { font-size:0.7rem; color:#999; text-transform:uppercase; letter-spacing:1px; }

  .hidden { display:none; }

  /* --- CONFETTI --- */
  .confetti-piece {
    position:fixed; width:10px; height:10px; top:-10px; z-index:999;
    pointer-events:none; border-radius:2px;
  }
  @keyframes confettiFall {
    to { transform: translateY(105vh) rotate(720deg); opacity:0; }
  }
</style>
</head>
<body>
<div class="app">
  <h1>English Master 5.2</h1>
  <div class="subtitle">Урок 5.2 · 62 предложения · Выучи и победи! 🏆</div>

  <!-- START -->
  <div id="startScreen" class="screen">
    <div class="start-card">
      <div class="emoji-big">🎯</div>
      <div class="modes">
        <button class="mode-btn" onclick="startGame('en-ru')">🇬🇧 English → 🇷🇺 Русский</button>
        <button class="mode-btn alt" onclick="startGame('ru-en')">🇷🇺 Русский → 🇬🇧 English</button>
        <button class="mode-btn alt2" onclick="startGame('audio')">🔊 Аудирование (на слух)</button>
      </div>
    </div>
  </div>

  <!-- GAME -->
  <div id="gameScreen" class="screen hidden">
    <div class="hud">
      <div class="hud-item">⭐ <span class="val" id="scoreVal">0</span></div>
      <div class="hud-item">🏆 <span class="val" id="qNum">1/10</span></div>
      <div class="hud-item lives" id="livesVal">❤️❤️❤️</div>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>

    <div class="q-card">
      <div class="q-label" id="qLabel">Переведите</div>
      <div class="q-text" id="qText">...</div>
      <button class="speak-btn hidden" id="speakBtn" onclick="speakCurrent()">🔊</button>
    </div>

    <div class="answers" id="answers"></div>
    <div class="feedback" id="feedback"></div>

    <div class="hint-row">
      <button class="hint-btn" id="hintBtn" onclick="useHint()">💡 Подсказка (2)</button>
    </div>
  </div>

  <!-- RESULT -->
  <div id="resultScreen" class="screen hidden">
    <div class="result-card">
      <div class="result-emoji" id="resEmoji">🏆</div>
      <div class="result-title" id="resTitle">Игра окончена!</div>
      <div class="result-stats">
        <div class="stat-box"><div class="num" id="resScore">0</div><div class="lbl">Очки</div></div>
        <div class="stat-box"><div class="num" id="resCorrect">0</div><div class="lbl">Верно</div></div>
        <div class="stat-box"><div class="num" id="resBest">0</div><div class="lbl">Рекорд</div></div>
      </div>
      <button class="mode-btn" onclick="backToStart()">🔄 Играть снова</button>
    </div>
  </div>
</div>

<script>
/* ===== ДАННЫЕ ИЗ ФАЙЛА ===== */
const DATA = [
  ["My boss reads all the documents","Мой босс читает все документы"],
  ["He tries to find a job","Он пытается найти работу"],
  ["They study very hard","Они учатся очень усердно"],
  ["These lessons help me","Эти уроки помогают мне"],
  ["He has money","У него есть деньги"],
  ["I live in Tajikistan","Я живу в Таджикистане"],
  ["You work very hard","Ты работаешь очень усердно"],
  ["He sometimes plays computer games","Он иногда играет в компьютерные игры"],
  ["Her brother often says it","Её брат часто говорит это"],
  ["My parents know it","Мои родители знают это"],
  ["My boss usually does so","Мой босс обычно делает так"],
  ["They have money","У них есть деньги"],
  ["She has this information","Она имеет эту информацию"],
  ["My parents want to do it","Мои родители хотят сделать это"],
  ["She sometimes goes to the cinema","Она иногда идёт в кино"],
  ["She wants more practice","Она хочет больше практики"],
  ["I remember it very well","Я помню это очень хорошо"],
  ["It seems interesting","Это выглядит интересно"],
  ["He feels happy","Он чувствует себя счастливым"],
  ["She misses you","Она скучает по тебе"],
  ["My friend has a car","У моего друга есть машина"],
  ["His father has a car","У его отца есть машина"],
  ["I feel happy","Я чувствую себя счастливым"],
  ["He wants more practice","Он хочет больше практики"],
  ["It really happens","Это реально случилось"],
  ["We understand you","Мы понимаем тебя"],
  ["He often goes to the cinema","Он часто идёт в кино"],
  ["He also remembers it","Он также помнит это"],
  ["He does it every day","Он делает это каждый день"],
  ["I remember it","Я помню это"],
  ["My boss always says it","Мой босс всегда говорит это"],
  ["He lives there","Он живёт там"],
  ["These lessons really help","Эти уроки реально помогают"],
  ["I feel it","Я чувствую это"],
  ["It happens","Это случилось"],
  ["He also works here","Он также работает здесь"],
  ["I go to school","Я иду в школу"],
  ["Our mother thinks the same","Наша мама думает также"],
  ["He really thinks so","Он реально думает так"],
  ["It really helps me","Это реально помогает мне"],
  ["She also works there","Она также работает там"],
  ["He wants more","Он хочет большего"],
  ["He knows more","Он знает многое"],
  ["He works very hard","Он работает очень усердно"],
  ["He thinks so","Он думает так"],
  ["He has a company","У него есть компания"],
  ["Its profit seems so big","Её прибыль кажется такой большой"],
  ["My boss knows everything","Мой босс знает всё"],
  ["She wants to go there","Она хочет идти туда"],
  ["She reads in English","Она читает на английском"],
  ["We speak English","Мы говорим по-английски"],
  ["You see it","Ты видишь это"],
  ["He wants to do it","Он хочет сделать это"],
  ["She feels so happy","Она чувствует себя такой счастливой"],
  ["I understand","Я понимаю"],
  ["I have a sister","У меня есть сестра"],
  ["He has an idea","У него есть идея"],
  ["She has interesting ideas","У неё есть интересные идеи"],
  ["I see everything","Я вижу всё"],
  ["She works very hard","Она работает очень усердно"],
  ["My boss usually checks all the information","Мой босс обычно проверяет всю информацию"],
  ["I love you","Я люблю тебя"]
];

/* ===== СОСТОЯНИЕ ===== */
let mode = 'en-ru';
let questions = [];
let current = 0;
let score = 0;
let correctCount = 0;
let lives = 3;
let hints = 2;
let streak = 0;
let bestScore = +localStorage.getItem('em52_best') || 0;
let locked = false;
const TOTAL_Q = 10;

/* ===== УТИЛИТЫ ===== */
const $ = id => document.getElementById(id);
const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ===== СТАРТ ИГРЫ ===== */
function startGame(m){
  mode = m;
  questions = shuffle(DATA.map((_,i)=>i)).slice(0,TOTAL_Q).map(idx => buildQuestion(idx));
  current = 0; score = 0; correctCount = 0; lives = 3; hints = 2; streak = 0; locked = false;
  $('startScreen').classList.add('hidden');
  $('resultScreen').classList.add('hidden');
  $('gameScreen').classList.remove('hidden');
  updateHUD();
  renderQuestion();
}

function buildQuestion(idx){
  const [en, ru] = DATA[idx];
  // собираем 3 неверных варианта
  const pool = DATA.map((_,i)=>i).filter(i=>i!==idx);
  const wrongs = shuffle(pool).slice(0,3).map(i => mode==='ru-en' ? DATA[i][0] : DATA[i][1]);
  const correct = mode==='ru-en' ? en : ru;
  const options = shuffle([correct, ...wrongs]);
  return { en, ru, correct, options, idx };
}

/* ===== РЕНДЕР ===== */
function renderQuestion(){
  locked = false;
  $('feedback').textContent = '';
  $('feedback').className = 'feedback';
  $('hintBtn').disabled = hints <= 0;
  $('hintBtn').textContent = `💡 Подсказка (${hints})`;

  const q = questions[current];
  let label, text, showSpeak = false;

  if(mode === 'en-ru'){ label = '🇬🇧 Переведите на русский'; text = q.en; }
  else if(mode === 'ru-en'){ label = '🇷🇺 Переведите на английский'; text = q.ru; }
  else { label = '🔊 Слушайте и выберите перевод'; text = '🔊 Нажмите, чтобы услышать'; showSpeak = true; }

  $('qLabel').textContent = label;
  $('qText').textContent = text;
  $('speakBtn').classList.toggle('hidden', !showSpeak);

  if(mode === 'audio'){ setTimeout(()=>speakText(q.en), 300); }

  // кнопки ответов
  const box = $('answers');
  box.innerHTML = '';
  q.options.forEach(opt => {
    const b = document.createElement('button');
    b.className = 'ans-btn';
    b.textContent = opt;
    b.onclick = () => answer(b, opt);
    box.appendChild(b);
  });

  // прогресс
  $('progressFill').style.width = (current / TOTAL_Q * 100) + '%';
  updateHUD();
}

function updateHUD(){
  $('scoreVal').textContent = score;
  $('qNum').textContent = `${Math.min(current+1,TOTAL_Q)}/${TOTAL_Q}`;
  $('livesVal').textContent = '❤️'.repeat(lives) + '🖤'.repeat(3-lives);
  $('progressFill').style.width = (current / TOTAL_Q * 100) + '%';
}

/* ===== ОТВЕТ ===== */
function answer(btn, opt){
  if(locked) return;
  locked = true;
  const q = questions[current];
  const all = [...$('answers').children];

  if(opt === q.correct){
    btn.classList.add('correct');
    streak++;
    const comboBonus = Math.min(streak, 5);
    const pts = 10 * comboBonus;
    score += pts;
    correctCount++;
    const fb = $('feedback');
    fb.className = 'feedback good';
    fb.textContent = streak >= 3
      ? `🔥 Комбо x${streak}! +${pts} очков!`
      : `✅ Верно! +${pts} очков`;
    confetti();
    speakText(q.en);
    if(streak > 1){
      const badge = document.createElement('div');
      badge.className = 'combo-badge';
      badge.textContent = `🔥 x${streak}`;
      $('.q-card') || document.querySelector('.q-card').appendChild(badge);
      setTimeout(()=>badge.remove(), 1500);
    }
    all.forEach(b => b.disabled = true);
    setTimeout(next, 1100);
  } else {
    btn.classList.add('wrong');
    all.forEach(b => {
      b.disabled = true;
      if(b.textContent === q.correct) b.classList.add('correct');
    });
    lives--; streak = 0;
    const fb = $('feedback');
    fb.className = 'feedback bad';
    fb.textContent = `❌ Ошибка. Правильно: «${q.correct}»`;
    updateHUD();
    if(lives <= 0){ setTimeout(()=>endGame(), 1400); }
    else { setTimeout(next, 1600); }
  }
  updateHUD();
}

function next(){
  current++;
  if(current >= TOTAL_Q){ endGame(); return; }
  // убираем combo badge если остался
  document.querySelectorAll('.combo-badge').forEach(b=>b.remove());
  renderQuestion();
}

/* ===== ПОДСКАЗКА ===== */
function useHint(){
  if(hints <= 0 || locked) return;
  hints--;
  const btns = [...$('answers').children].filter(b => b.textContent !== questions[current].correct && !b.disabled);
  shuffle(btns).slice(0,2).forEach(b => { b.style.opacity = 0.25; b.disabled = true; b.style.pointerEvents='none'; });
  $('hintBtn').disabled = true;
  $('hintBtn').textContent = `💡 Подсказка (${hints})`;
}

/* ===== КОНЕЦ ===== */
function endGame(){
  $('gameScreen').classList.add('hidden');
  $('resultScreen').classList.remove('hidden');
  if(score > bestScore){ bestScore = score; localStorage.setItem('em52_best', bestScore); }
  $('resScore').textContent = score;
  $('resCorrect').textContent = `${correctCount}/${TOTAL_Q}`;
  $('resBest').textContent = bestScore;

  let emoji, title;
  if(lives > 0 && correctCount === TOTAL_Q){ emoji='👑'; title='Идеально! Ты мастер!'; }
  else if(lives > 0){ emoji='🎉'; title='Отлично! Продолжай!'; }
  else if(correctCount >= 6){ emoji='💪'; title='Хороший результат!'; }
  else { emoji='📚'; title='Ещё потренируйся!'; }
  $('resEmoji').textContent = emoji;
  $('resTitle').textContent = title;
  if(lives > 0) confetti(60);
}

function backToStart(){
  $('resultScreen').classList.add('hidden');
  $('startScreen').classList.remove('hidden');
}

/* ===== ОЗВУЧКА ===== */
function speakText(t){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = 'en-US';
  u.rate = 0.9;
  window.speechSynthesis.speak(u);
}
function speakCurrent(){
  speakText(questions[current].en);
}

/* ===== КОНФЕТТИ ===== */
function confetti(count=25){
  const colors = ['#667eea','#f093fb','#ff9a56','#4facfe','#4caf50','#ffcc33'];
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    p.className = 'confetti-piece';
    p.style.left = Math.random()*100 + 'vw';
    p.style.background = pick(colors);
    p.style.animation = `confettiFall ${1.5+Math.random()*1.5}s linear forwards`;
    p.style.animationDelay = Math.random()*0.4 + 's';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(), 3500);
  }
}

/* ===== СТАРТОВЫЙ ЭКРАН ===== */
updateHUD();
</script>
</body>
</html>
