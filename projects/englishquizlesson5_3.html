<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>Урок 5.3 · Игра-тренажёр</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(145deg, #1a2a6c, #2a3f8f, #1e3b6e);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .game-container {
      max-width: 900px;
      width: 100%;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 56px;
      padding: 28px 22px 34px;
      box-shadow: 0 25px 40px -10px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.15);
      transition: all 0.2s;
    }

    h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #ffffff;
      text-align: center;
      letter-spacing: -0.5px;
      text-shadow: 0 4px 12px rgba(0, 0, 0, 0.5);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    h1 span {
      background: #ffd966;
      color: #1a2a6c;
      font-size: 1.4rem;
      padding: 6px 16px;
      border-radius: 100px;
      font-weight: 700;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.1);
    }

    .subhead {
      text-align: center;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 400;
      font-size: 1rem;
      margin-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 16px;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      border-radius: 100px;
      padding: 8px 18px;
      margin-bottom: 24px;
      color: white;
      font-weight: 500;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-wrap: wrap;
      gap: 10px;
    }

    .stats .progress {
      background: #3b4f9b;
      padding: 4px 14px;
      border-radius: 100px;
      font-size: 0.95rem;
      box-shadow: inset 0 -2px 0 rgba(0, 0, 0, 0.2);
    }

    .stats .score {
      background: #ffb347;
      padding: 4px 16px;
      border-radius: 100px;
      color: #1e2b4f;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 2px 10px rgba(255, 180, 70, 0.3);
    }

    .question-card {
      background: #ffffff;
      border-radius: 44px;
      padding: 38px 28px 32px;
      margin-bottom: 22px;
      box-shadow: 0 30px 30px -15px rgba(0, 0, 0, 0.5), inset 0 -2px 0 rgba(0, 0, 0, 0.05);
      transition: transform 0.2s;
      text-align: center;
    }

    .question-card .sentence {
      font-size: 2.2rem;
      font-weight: 700;
      color: #111d3a;
      line-height: 1.3;
      word-break: break-word;
      margin-bottom: 12px;
      letter-spacing: -0.3px;
    }

    .question-card .hint {
      font-size: 1rem;
      color: #6d7a9e;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin: 18px 0 20px;
    }

    .option-btn {
      background: rgba(255, 255, 255, 0.95);
      border: none;
      border-radius: 28px;
      padding: 22px 8px;
      font-size: 1.25rem;
      font-weight: 600;
      color: #111d3a;
      box-shadow: 0 8px 0 #0e1a2b, 0 8px 18px rgba(0, 0, 0, 0.25);
      transition: all 0.06s ease;
      cursor: pointer;
      word-break: break-word;
      line-height: 1.3;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 90px;
      text-align: center;
      touch-action: manipulation;
      border: 1px solid rgba(255, 255, 255, 0.5);
      font-family: inherit;
    }

    .option-btn:active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #0e1a2b, 0 5px 12px rgba(0, 0, 0, 0.3);
    }

    .option-btn.correct {
      background: #a5e3b0;
      box-shadow: 0 6px 0 #1f6e2e, 0 6px 16px rgba(0, 0, 0, 0.2);
      transform: translateY(2px);
      color: #0e3f1a;
      border-color: #62b87a;
    }

    .option-btn.wrong {
      background: #f8b5b5;
      box-shadow: 0 6px 0 #9e2b2b, 0 6px 16px rgba(0, 0, 0, 0.2);
      transform: translateY(2px);
      color: #520e0e;
      border-color: #d66868;
    }

    .option-btn:disabled {
      opacity: 0.8;
      transform: translateY(4px);
      box-shadow: 0 4px 0 #0e1a2b, 0 5px 14px rgba(0, 0, 0, 0.2);
      pointer-events: none;
    }

    .feedback {
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.3rem;
      font-weight: 600;
      color: #ffd966;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
      letter-spacing: 0.3px;
      transition: 0.15s;
    }

    .next-btn {
      background: #ffd966;
      border: none;
      width: 100%;
      padding: 20px;
      border-radius: 40px;
      font-size: 1.5rem;
      font-weight: 800;
      color: #1a2a6c;
      box-shadow: 0 9px 0 #b28b2e, 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: all 0.06s ease;
      cursor: pointer;
      letter-spacing: 0.5px;
      margin-top: 4px;
      touch-action: manipulation;
      border: 1px solid rgba(255, 255, 255, 0.5);
    }

    .next-btn:active {
      transform: translateY(7px);
      box-shadow: 0 2px 0 #b28b2e, 0 5px 18px rgba(0, 0, 0, 0.5);
    }

    .next-btn:disabled {
      opacity: 0.5;
      transform: translateY(5px);
      box-shadow: 0 4px 0 #b28b2e, 0 5px 18px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    .restart-btn {
      background: transparent;
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 12px 28px;
      border-radius: 40px;
      font-size: 1rem;
      font-weight: 600;
      margin-top: 12px;
      cursor: pointer;
      transition: 0.15s;
      width: 100%;
      touch-action: manipulation;
      background: rgba(255, 255, 255, 0.05);
    }

    .restart-btn:active {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(0.98);
    }

    @media (max-width: 550px) {
      .game-container {
        padding: 16px 14px 24px;
        border-radius: 36px;
      }
      h1 { font-size: 1.6rem; }
      h1 span { font-size: 1.1rem; padding: 4px 12px; }
      .question-card { padding: 28px 16px 22px; border-radius: 32px; }
      .question-card .sentence { font-size: 1.7rem; }
      .options-grid { gap: 10px; }
      .option-btn {
        font-size: 1rem;
        padding: 16px 6px;
        min-height: 74px;
        border-radius: 22px;
      }
      .next-btn { font-size: 1.3rem; padding: 16px; border-radius: 32px; }
      .feedback { font-size: 1.1rem; min-height: 48px; }
      .stats { font-size: 0.9rem; }
    }

    @media (max-width: 380px) {
      .options-grid { grid-template-columns: 1fr; }
      .option-btn { min-height: 60px; }
      .question-card .sentence { font-size: 1.4rem; }
    }

    /* анимация появления */
    @keyframes pop {
      0% { transform: scale(0.96); opacity: 0.7; }
      100% { transform: scale(1); opacity: 1; }
    }
    .question-card, .options-grid, .next-btn {
      animation: pop 0.2s ease-out;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
<div class="game-container">
  <h1>📘 Урок 5.3 <span>Play</span></h1>
  <div class="subhead">Выбери правильный перевод</div>

  <div class="stats">
    <div class="progress" id="progressDisplay">1 / 60</div>
    <div class="score" id="scoreDisplay">⭐ 0</div>
  </div>

  <div class="question-card" id="questionCard">
    <div class="sentence" id="englishSentence">I have a family</div>
    <div class="hint">🇬🇧 → 🇷🇺</div>
  </div>

  <div class="options-grid" id="optionsContainer"></div>

  <div class="feedback" id="feedbackMessage"></div>

  <button class="next-btn" id="nextButton" disabled>Дальше →</button>
  <button class="restart-btn" id="restartButton">🔄 Начать заново</button>
</div>

<script>
  // ---------- ДАННЫЕ ИЗ УРОКА 5.3 (60 пар) ----------
  const lessonData = [
    { en: "I have a family", ru: "У меня есть семья" },
    { en: "I work here", ru: "Я работаю здесь" },
    { en: "This lesson seems interesting", ru: "Этот урок кажется интересным" },
    { en: "She does it very well", ru: "Она делает это очень хорошо" },
    { en: "My friend thinks so", ru: "Мой друг думает так" },
    { en: "She loves you", ru: "Она любит тебя" },
    { en: "Our boss knows it", ru: "Наш босс знает это" },
    { en: "It looks interesting", ru: "Это выглядит интересным" },
    { en: "My brother wants it", ru: "Мой брат хочет это" },
    { en: "All your ideas seem very interesting", ru: "Все твои идеи кажутся очень интересными" },
    { en: "He loves you", ru: "Он любит тебя" },
    { en: "We remember it", ru: "Мы помним это" },
    { en: "My brother tries to do it", ru: "Мой брат пытается сделать это" },
    { en: "My sister lives there", ru: "Моя сестра живёт там" },
    { en: "I work there", ru: "Я работаю там" },
    { en: "I understand those people", ru: "Я понимаю тех людей" },
    { en: "She always does it well", ru: "Она всегда делает это хорошо" },
    { en: "I live in this country", ru: "Я живу в этой стране" },
    { en: "I live in this city", ru: "Я живу в этом городе" },
    { en: "She teaches it", ru: "Она преподаёт это" },
    { en: "I think so", ru: "Я думаю так" },
    { en: "She also thinks so", ru: "Она также думает так" },
    { en: "He tries to do it", ru: "Он пытается сделать это" },
    { en: "He lives in this country", ru: "Он живёт в этой стране" },
    { en: "His idea seems very interesting", ru: "Его идея кажется очень интересной" },
    { en: "His lessons seem very useful", ru: "Его уроки кажутся очень полезными" },
    { en: "He also works here", ru: "Он также работает здесь" },
    { en: "She goes to school", ru: "Она идёт в школу" },
    { en: "I read English books", ru: "Я читаю английские книги" },
    { en: "She helps me", ru: "Она помогает мне" },
    { en: "He also knows it", ru: "Он также знает это" },
    { en: "We see his success", ru: "Мы видим его успех" },
    { en: "She often goes to the park", ru: "Она часто идёт в парк" },
    { en: "That offer seems strange", ru: "То предложение кажется странным" },
    { en: "He has an offer", ru: "У него есть предложение" },
    { en: "Their ideas seem very interesting", ru: "Их идеи кажутся очень интересными" },
    { en: "She always does it on time", ru: "Она всегда делает это вовремя" },
    { en: "He sees that mistake", ru: "Он видит эту ошибку" },
    { en: "She watches TV", ru: "Она смотрит телевизор" },
    { en: "She wants more", ru: "Она хочет большего" },
    { en: "I work", ru: "Я работаю" },
    { en: "Her words seem strange", ru: "Её слова кажутся странными" },
    { en: "He often plays computer games", ru: "Он часто играет в компьютерные игры" },
    { en: "He goes to work", ru: "Он идёт на работу" },
    { en: "She lives in that place", ru: "Она живёт в том месте" },
    { en: "He understands you very well", ru: "Он понимает тебя очень хорошо" },
    { en: "They go to work", ru: "Они идут на работу" },
    { en: "You always say it", ru: "Ты всегда говоришь это" },
    { en: "This lesson helps me", ru: "Этот урок помогает мне" },
    { en: "They often go to the cinema", ru: "Они часто ходят в кино" },
    { en: "These lessons seem very useful", ru: "Эти уроки кажутся очень полезными" },
    { en: "They help me", ru: "Они помогают мне" },
    { en: "I speak English", ru: "Я говорю по-английски" },
    { en: "He sometimes wants to do it", ru: "Он иногда хочет сделать это" },
    { en: "I understand everything", ru: "Я понимаю всё" },
    { en: "She lives in this place", ru: "Она живёт в этом месте" },
    { en: "I read in English", ru: "Я читаю по-английски" },
    { en: "He says interesting things", ru: "Он говорит интересные вещи" },
    { en: "We see their success", ru: "Мы видим их успех" },
    { en: "I know this word", ru: "Я знаю это слово" }
  ];

  // ---------- ЗВУКИ (Web Audio API) ----------
  let audioCtx = null;

  function initAudio() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
  }

  function playTone(freq, duration, type = 'sine', volume = 0.15, delay = 0) {
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gainNode.gain.setValueAtTime(0, now + delay);
    gainNode.gain.linearRampToValueAtTime(volume, now + delay + 0.01);
    gainNode.gain.linearRampToValueAtTime(0, now + delay + duration);
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    osc.start(now + delay);
    osc.stop(now + delay + duration);
  }

  function playCorrect() {
    initAudio();
    playTone(659.25, 0.12, 'sine', 0.2);      // E5
    playTone(783.99, 0.12, 'sine', 0.2, 0.1); // G5
    playTone(1046.50, 0.2, 'sine', 0.2, 0.2); // C6
  }

  function playWrong() {
    initAudio();
    playTone(220, 0.2, 'sawtooth', 0.12);
    playTone(180, 0.25, 'sawtooth', 0.1, 0.1);
  }

  function playClick() {
    initAudio();
    playTone(600, 0.04, 'square', 0.08);
  }

  function playVictory() {
    initAudio();
    playTone(523.25, 0.15, 'sine', 0.2); // C5
    playTone(659.25, 0.15, 'sine', 0.2, 0.15); // E5
    playTone(783.99, 0.15, 'sine', 0.2, 0.3); // G5
    playTone(1046.50, 0.4, 'sine', 0.25, 0.45); // C6
  }

  // ---------- ЛОГИКА ИГРЫ ----------
  const questions = [...lessonData].sort(() => Math.random() - 0.5); // перемешаем порядок
  let currentIndex = 0;
  let score = 0;
  let answered = false;
  let currentQuestion = null;
  let correctAnswerText = '';
  let options = [];

  const progressDisplay = document.getElementById('progressDisplay');
  const scoreDisplay = document.getElementById('scoreDisplay');
  const englishSentence = document.getElementById('englishSentence');
  const optionsContainer = document.getElementById('optionsContainer');
  const feedbackMessage = document.getElementById('feedbackMessage');
  const nextButton = document.getElementById('nextButton');
  const restartButton = document.getElementById('restartButton');
  const questionCard = document.getElementById('questionCard');

  // Перемешать массив
  function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function updateStats() {
    progressDisplay.textContent = `${currentIndex + 1} / ${questions.length}`;
    scoreDisplay.textContent = `⭐ ${score}`;
  }

  function loadQuestion() {
    if (currentIndex >= questions.length) {
      finishGame();
      return;
    }

    answered = false;
    currentQuestion = questions[currentIndex];
    englishSentence.textContent = currentQuestion.en;
    correctAnswerText = currentQuestion.ru;

    // Собираем 3 неверных варианта (из других вопросов)
    const otherAnswers = lessonData
      .filter(item => item.ru !== correctAnswerText)
      .map(item => item.ru);
    const shuffledOthers = shuffleArray([...otherAnswers]);
    const wrongOptions = shuffledOthers.slice(0, 3);

    options = shuffleArray([correctAnswerText, ...wrongOptions]);

    // Отрисовка кнопок
    optionsContainer.innerHTML = '';
    options.forEach((optText) => {
      const btn = document.createElement('button');
      btn.classList.add('option-btn');
      btn.textContent = optText;
      btn.dataset.value = optText;
      btn.addEventListener('click', (e) => handleAnswer(e, btn, optText));
      optionsContainer.appendChild(btn);
    });

    // Сброс состояний
    feedbackMessage.textContent = '';
    nextButton.disabled = true;
    document.querySelectorAll('.option-btn').forEach(b => {
      b.classList.remove('correct', 'wrong');
      b.disabled = false;
    });

    // Небольшая анимация карточки
    questionCard.style.animation = 'none';
    questionCard.offsetHeight; // reflow
    questionCard.style.animation = 'pop 0.2s ease-out';

    updateStats();
  }

  function handleAnswer(event, btn, selectedText) {
    if (answered) return;
    answered = true;

    const isCorrect = (selectedText === correctAnswerText);
    const allButtons = document.querySelectorAll('.option-btn');

    // Блокируем все кнопки
    allButtons.forEach(b => b.disabled = true);

    if (isCorrect) {
      btn.classList.add('correct');
      score += 1;
      scoreDisplay.textContent = `⭐ ${score}`;
      feedbackMessage.textContent = '✅ Верно! Отлично!';
      playCorrect();
    } else {
      btn.classList.add('wrong');
      // Показать правильный ответ
      allButtons.forEach(b => {
        if (b.dataset.value === correctAnswerText) {
          b.classList.add('correct');
        }
      });
      feedbackMessage.textContent = `❌ Ошибка. Правильно: ${correctAnswerText}`;
      playWrong();
    }

    // Разрешаем нажать "Дальше"
    nextButton.disabled = false;
    playClick();
  }

  function nextQuestion() {
    if (!answered) return; // защита
    currentIndex++;
    if (currentIndex < questions.length) {
      loadQuestion();
    } else {
      finishGame();
    }
  }

  function finishGame() {
    // Экран окончания
    englishSentence.textContent = '🎉 Поздравляем!';
    feedbackMessage.textContent = `Твой результат: ${score} из ${questions.length}`;
    optionsContainer.innerHTML = '';
    nextButton.disabled = true;
    nextButton.textContent = '🏁 Игра окончена';
    progressDisplay.textContent = `${questions.length} / ${questions.length}`;
    playVictory();
    // Скрыть кнопку дальше? Оставим, но она disabled
  }

  function restartGame() {
    // Перезапуск
    currentIndex = 0;
    score = 0;
    answered = false;
    // Перемешаем вопросы заново
    const newOrder = [...lessonData].sort(() => Math.random() - 0.5);
    questions.length = 0;
    questions.push(...newOrder);
    nextButton.textContent = 'Дальше →';
    nextButton.disabled = true;
    loadQuestion();
    updateStats();
    playClick();
  }

  // Инициализация и обработчики
  nextButton.addEventListener('click', () => {
    if (!nextButton.disabled) {
      nextQuestion();
    }
  });

  restartButton.addEventListener('click', restartGame);

  // Для мобильных устройств: разблокировка аудио по первому касанию
  document.body.addEventListener('touchstart', function unlockAudio() {
    initAudio();
  }, { once: true });

  document.body.addEventListener('click', function unlockAudioClick() {
    initAudio();
  }, { once: true });

  // Запуск первой загрузки
  loadQuestion();
</script>
</body>
</html>
