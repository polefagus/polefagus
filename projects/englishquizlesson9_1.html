<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>3D English Lesson 9.1 — закрепление</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Segoe UI', 'Arial', sans-serif;
            background: #0a0a1a;
            color: white;
            touch-action: pan-y pinch-zoom; /* улучшает мобильное взаимодействие */
        }
        #info {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 18px;
            border-radius: 40px;
            border: 1px solid rgba(255,215,0,0.5);
            font-weight: 600;
            letter-spacing: 1px;
            color: #ffd966;
            box-shadow: 0 4px 15px rgba(0,0,0,0.7);
            z-index: 10;
            font-size: 1rem;
            pointer-events: none;
        }
        #mode-panel {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 8px;
            z-index: 20;
            background: rgba(10, 10, 30, 0.75);
            backdrop-filter: blur(8px);
            padding: 8px 12px;
            border-radius: 50px;
            border: 1px solid #4a4a8a;
        }
        .mode-btn {
            background: transparent;
            border: 1px solid #6a6aae;
            color: #ccc;
            padding: 8px 16px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .mode-btn.active {
            background: #ffd966;
            border-color: #ffd966;
            color: #1a1a2e;
            box-shadow: 0 0 15px #ffd96688;
        }
        .mode-btn:hover {
            background: #4a4a8a;
            color: white;
        }
        #question-card {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 750px;
            background: rgba(20, 20, 40, 0.85);
            backdrop-filter: blur(12px);
            border-radius: 30px;
            padding: 20px 25px;
            border: 2px solid #ffd966;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
            z-index: 30;
            text-align: center;
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        #question-text {
            font-size: 1.6rem;
            font-weight: 700;
            margin-bottom: 8px;
            word-break: break-word;
            color: #fff;
            text-shadow: 0 2px 10px #000;
        }
        #question-lang {
            font-size: 0.9rem;
            color: #aaa;
            text-transform: uppercase;
            letter-spacing: 3px;
        }
        #options-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 95%;
            max-width: 800px;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            z-index: 30;
        }
        .option-btn {
            flex: 1 1 180px;
            padding: 18px 12px;
            border-radius: 20px;
            border: 2px solid transparent;
            font-size: 1.2rem;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, background 0.2s, border-color 0.2s;
            text-align: center;
            backdrop-filter: blur(4px);
            box-shadow: 0 8px 20px rgba(0,0,0,0.6);
            color: white;
            text-shadow: 0 1px 4px black;
            background: rgba(30,30,60,0.9);
            border-color: #4a4a8a;
            word-break: break-word;
        }
        .option-btn:hover {
            transform: scale(1.02);
            border-color: #ffd966;
        }
        .option-btn:active {
            transform: scale(0.98);
        }
        .option-btn.correct {
            background: #2e7d32 !important;
            border-color: #a5d6a7 !important;
            box-shadow: 0 0 25px #4caf50;
        }
        .option-btn.wrong {
            background: #b71c1c !important;
            border-color: #ef9a9a !important;
            box-shadow: 0 0 25px #f44336;
        }
        .option-btn.disabled {
            pointer-events: none;
            opacity: 0.8;
        }
        #score-board {
            position: absolute;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            padding: 8px 25px;
            border-radius: 40px;
            border: 1px solid #ffd966;
            font-weight: 700;
            font-size: 1.3rem;
            color: #ffd966;
            z-index: 15;
            box-shadow: 0 4px 12px black;
            white-space: nowrap;
        }
        #audio-control {
            position: absolute;
            bottom: 200px;
            right: 20px;
            z-index: 40;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .audio-btn {
            background: rgba(20,20,40,0.8);
            border: 1px solid #ffd966;
            color: #ffd966;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.6rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 12px black;
            transition: 0.2s;
        }
        .audio-btn:hover {
            background: #ffd966;
            color: #1a1a2e;
        }
        #next-btn {
            position: absolute;
            bottom: 180px;
            right: 20px;
            background: #ffd966;
            border: none;
            color: #1a1a2e;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 1.2rem;
            cursor: pointer;
            box-shadow: 0 0 30px #ffd96688;
            z-index: 35;
            display: none;
            transition: 0.2s;
            letter-spacing: 1px;
        }
        #next-btn:hover {
            transform: scale(1.05);
            background: #ffe68f;
        }
        @media (max-width: 700px) {
            #question-text { font-size: 1.2rem; }
            #question-card { bottom: 210px; padding: 15px; width: 92%; }
            .option-btn { font-size: 1rem; padding: 14px 8px; flex: 1 1 140px; }
            #next-btn { bottom: 210px; padding: 12px 22px; font-size: 1rem; }
            #mode-panel { padding: 5px 8px; gap: 5px; }
            .mode-btn { padding: 6px 10px; font-size: 0.75rem; }
            #score-board { font-size: 1rem; padding: 6px 16px; top: 70px; }
            #audio-control { bottom: 280px; }
            .audio-btn { width: 44px; height: 44px; font-size: 1.3rem; }
        }
    </style>
</head>
<body>

<div id="info">📘 Lesson 9.1 — 26.11.2026</div>

<div id="mode-panel">
    <button class="mode-btn active" data-mode="en-ru">🇬🇧→🇷🇺</button>
    <button class="mode-btn" data-mode="ru-en">🇷🇺→🇬🇧</button>
    <button class="mode-btn" data-mode="mixed">🔀 Смешанный</button>
</div>

<div id="score-board">Счёт: 0 / 0</div>

<div id="question-card">
    <div id="question-lang">English</div>
    <div id="question-text">Loading...</div>
</div>

<div id="options-container"></div>

<button id="next-btn">➡️ Дальше</button>

<div id="audio-control">
    <button class="audio-btn" id="music-toggle">🎵</button>
    <button class="audio-btn" id="sound-toggle">🔊</button>
</div>

<!-- Three.js и аудио -->
<script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.126.0/build/three.module.js"
        }
    }
</script>

<script type="module">
    import * as THREE from 'three';

    // ---------- ДАННЫЕ ИЗ EXCEL (Lesson #9.1 - 26.11.2026) ----------
    // Пары: [English, правильный русский перевод] (берём из столбца C, исправляем очевидные опечатки)
    const lessonPairs = [
        { en: "That offer doesn't seem strange", ru: "Это предложение не кажется странным" },
        { en: "His boss doesn't speak English fluently", ru: "Его начальник не владеет английским свободно" },
        { en: "My parents don't discuss it", ru: "Мои родители это не обсуждают" },
        { en: "These things don't attract me", ru: "Меня это не привлекает" },
        { en: "Those things don't seem strange", ru: "Эти вещи не кажутся странными" },
        { en: "His son doesn't want to become a doctor", ru: "Его сын не хочет стать врачом" },
        { en: "Our teacher doesn't believe us", ru: "Наш учитель нам не верит" },
        { en: "My partner doesn't know him", ru: "Мой партнёр его не знает" },
        { en: "My friend doesn't like this idea", ru: "Моему другу эта идея не нравится" },
        { en: "She thinks money doesn't make people happy", ru: "Она считает, что деньги не делают людей счастливыми" },
        { en: "This person doesn't try to change his life", ru: "Этот человек не пытается изменить свою жизнь" },
        { en: "My boss doesn't see her", ru: "Мой начальник её не видит" },
        { en: "These things don't attract me", ru: "Меня это не привлекает" },
        { en: "My friends don't recommend this hotel", ru: "Мои друзья не рекомендуют этот отель" },
        { en: "My sister doesn't know this person", ru: "Моя сестра не знает этого человека" },
        { en: "My brother doesn't want to think about his future", ru: "Мой брат не хочет думать о своем будущем" },
        { en: "My friend and I don't call them", ru: "Мы с другом их не называем" },
        { en: "My friend doesn't think so", ru: "Мой друг так не считает" },
        { en: "My friend doesn't think the same", ru: "Мой друг так не думает" },
        { en: "Those lessons don't seem useful", ru: "Эти уроки не кажутся полезными" },
        { en: "These lessons seem very useful", ru: "Эти уроки кажутся очень полезными" },
        { en: "My sister doesn't want to do it later", ru: "Моя сестра не хочет делать это позже" },
        { en: "She wants to do it right now", ru: "Она хочет сделать это прямо сейчас" },
        { en: "This thing doesn't interest me", ru: "Меня это не интересует" },
        { en: "Its profit doesn't seem big", ru: "Прибыль, похоже, невелика" },
        { en: "My friend doesn't try to do it", ru: "Мой друг не пытается этого сделать" },
        { en: "Their company doesn't try to do it", ru: "Их компания не пытается этого делать" },
        { en: "That thing doesn't seem interesting", ru: "Эта штука не кажется интересной" },
        { en: "My sister doesn't want to study there", ru: "Моя сестра не хочет там учиться" },
        { en: "That method doesn't work", ru: "Этот метод не работает" },
        { en: "This method really helps", ru: "Этот метод действительно помогает" },
        { en: "Their parents don't feel happy", ru: "Их родители не чувствуют себя счастливыми" },
        { en: "He thinks money doesn't bring people happiness", ru: "Он считает, что деньги не приносят людям счастья" },
        { en: "This offer doesn't seem interesting", ru: "Это предложение не кажется интересным" },
        { en: "Our company doesn't want it", ru: "Наша компания этого не хочет" },
        { en: "My friend doesn't agree with me", ru: "Мой друг со мной не согласен" }
    ];

    // ---------- ГЛОБАЛЬНЫЕ ПЕРЕМЕННЫЕ ----------
    let currentMode = 'en-ru'; // 'en-ru', 'ru-en', 'mixed'
    let currentQuestion = null;
    let correctAnswer = '';
    let questionType = ''; // 'en-ru' or 'ru-en'
    let score = 0;
    let total = 0;
    let canAnswer = true;
    let musicOn = true;
    let soundOn = true;
    let audioCtx = null;
    let musicGain = null;
    let musicOscillators = [];

    // ---------- THREE.JS СЦЕНА ----------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a1a);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 2, 10);
    camera.lookAt(0, 0, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // Освещение
    const ambientLight = new THREE.AmbientLight(0x404060);
    scene.add(ambientLight);
    const dirLight = new THREE.DirectionalLight(0xffeedd, 1);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    scene.add(dirLight);
    const fillLight = new THREE.PointLight(0x4466ff, 0.5);
    fillLight.position.set(-5, 3, 5);
    scene.add(fillLight);
    const backLight = new THREE.PointLight(0xffaa44, 0.4);
    backLight.position.set(0, 2, -8);
    scene.add(backLight);

    // Центральный объект (кристалл)
    const crystalGeo = new THREE.IcosahedronGeometry(1.4, 2);
    const crystalMat = new THREE.MeshStandardMaterial({
        color: 0xffd966,
        emissive: 0x553300,
        roughness: 0.2,
        metalness: 0.8,
        wireframe: false,
        transparent: true,
        opacity: 0.95
    });
    const crystal = new THREE.Mesh(crystalGeo, crystalMat);
    crystal.castShadow = true;
    crystal.receiveShadow = true;
    crystal.position.y = 1.5;
    scene.add(crystal);

    // Кольца вокруг кристалла
    const ringMat = new THREE.MeshStandardMaterial({ color: 0x4a6eff, emissive: 0x1a2a7a, transparent: true, opacity: 0.7 });
    const ring1 = new THREE.Mesh(new THREE.TorusGeometry(2.2, 0.06, 16, 100), ringMat);
    ring1.rotation.x = Math.PI / 2;
    ring1.position.y = 1.5;
    scene.add(ring1);

    const ring2 = new THREE.Mesh(new THREE.TorusGeometry(2.6, 0.04, 16, 100), ringMat);
    ring2.rotation.z = Math.PI / 3;
    ring2.rotation.x = Math.PI / 4;
    ring2.position.y = 1.5;
    scene.add(ring2);

    // Частицы (звёзды)
    const particlesGeo = new THREE.BufferGeometry();
    const particlesCount = 1500;
    const posArray = new Float32Array(particlesCount * 3);
    for (let i = 0; i < particlesCount * 3; i += 3) {
        posArray[i] = (Math.random() - 0.5) * 80;
        posArray[i+1] = (Math.random() - 0.5) * 50;
        posArray[i+2] = (Math.random() - 0.5) * 80 - 20;
    }
    particlesGeo.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
    const particlesMat = new THREE.PointsMaterial({
        color: 0x99aaff,
        size: 0.12,
        transparent: true,
        opacity: 0.8,
        blending: THREE.AdditiveBlending
    });
    const particles = new THREE.Points(particlesGeo, particlesMat);
    scene.add(particles);

    // Пол (плоскость с сеткой)
    const gridHelper = new THREE.GridHelper(30, 30, 0x4a6eff, 0x2a2a5a);
    gridHelper.position.y = -0.5;
    scene.add(gridHelper);

    // ---------- АУДИО ----------
    function initAudio() {
        if (audioCtx) return;
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // Фоновая музыка (генеративная)
        musicGain = audioCtx.createGain();
        musicGain.gain.value = musicOn ? 0.08 : 0;
        musicGain.connect(audioCtx.destination);

        // Создаём несколько осцилляторов для атмосферного пада
        const notes = [220, 277.18, 329.63, 440]; // A3, C#4, E4, A4
        notes.forEach((freq, i) => {
            const osc = audioCtx.createOscillator();
            osc.type = 'sine';
            osc.frequency.value = freq / (i % 2 === 0 ? 1 : 2);
            const gain = audioCtx.createGain();
            gain.gain.value = 0.03;
            osc.connect(gain);
            gain.connect(musicGain);
            osc.start();
            musicOscillators.push(osc);
        });
        // Модуляция
        const lfo = audioCtx.createOscillator();
        lfo.frequency.value = 0.1;
        const lfoGain = audioCtx.createGain();
        lfoGain.gain.value = 0.02;
        lfo.connect(lfoGain);
        lfoGain.connect(musicGain.gain);
        lfo.start();
    }

    function playSound(type) {
        if (!soundOn || !audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'correct') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, now);
            osc.frequency.exponentialRampToValueAtTime(1320, now + 0.15);
            gain.gain.setValueAtTime(0.15, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.4);
        } else if (type === 'wrong') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(220, now);
            osc.frequency.exponentialRampToValueAtTime(110, now + 0.3);
            gain.gain.setValueAtTime(0.12, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.35);
        } else if (type === 'click') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(600, now);
            gain.gain.setValueAtTime(0.08, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now);
            osc.stop(now + 0.1);
        }
    }

    // Инициализация аудио при первом клике
    document.body.addEventListener('click', () => {
        if (!audioCtx) {
            initAudio();
        }
    }, { once: true });

    // ---------- ИГРОВАЯ ЛОГИКА ----------
    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function generateQuestion() {
        if (lessonPairs.length === 0) return;
        // Выбираем случайную пару
        const pair = lessonPairs[Math.floor(Math.random() * lessonPairs.length)];
        
        let qText, ansText, qLang;
        if (currentMode === 'en-ru') {
            qText = pair.en;
            ansText = pair.ru;
            qLang = 'English → Русский';
            questionType = 'en-ru';
        } else if (currentMode === 'ru-en') {
            qText = pair.ru;
            ansText = pair.en;
            qLang = 'Русский → English';
            questionType = 'ru-en';
        } else { // mixed
            if (Math.random() < 0.5) {
                qText = pair.en;
                ansText = pair.ru;
                qLang = 'English → Русский';
                questionType = 'en-ru';
            } else {
                qText = pair.ru;
                ansText = pair.en;
                qLang = 'Русский → English';
                questionType = 'ru-en';
            }
        }

        currentQuestion = qText;
        correctAnswer = ansText;
        
        // Обновляем DOM
        document.getElementById('question-lang').textContent = qLang;
        document.getElementById('question-text').textContent = qText;

        // Генерируем варианты (1 правильный + 3 неправильных)
        // Собираем все возможные ответы из других пар
        let otherAnswers = [];
        if (questionType === 'en-ru') {
            otherAnswers = lessonPairs.map(p => p.ru).filter(a => a !== correctAnswer);
        } else {
            otherAnswers = lessonPairs.map(p => p.en).filter(a => a !== correctAnswer);
        }
        // Убираем дубликаты
        otherAnswers = [...new Set(otherAnswers)];
        // Перемешиваем и берём 3
        shuffleArray(otherAnswers);
        let wrongOptions = otherAnswers.slice(0, 3);
        // Если вдруг меньше 3 (маловероятно), добиваем
        while (wrongOptions.length < 3) {
            wrongOptions.push("—");
        }

        let allOptions = [correctAnswer, ...wrongOptions];
        shuffleArray(allOptions);

        // Отрисовываем кнопки с разноцветными стилями
        const container = document.getElementById('options-container');
        container.innerHTML = '';
        const colors = [
            'linear-gradient(145deg, #2a4a8a, #1a2a5a)',
            'linear-gradient(145deg, #6a2a8a, #3a1a5a)',
            'linear-gradient(145deg, #2a6a8a, #1a4a5a)',
            'linear-gradient(145deg, #8a4a2a, #5a2a1a)'
        ];
        // Перемешаем цвета
        shuffleArray(colors);
        
        allOptions.forEach((opt, idx) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.textContent = opt;
            btn.style.background = colors[idx % colors.length];
            btn.dataset.value = opt;
            btn.addEventListener('click', (e) => {
                if (!canAnswer) return;
                e.stopPropagation();
                checkAnswer(opt, btn);
            });
            container.appendChild(btn);
        });

        canAnswer = true;
        document.getElementById('next-btn').style.display = 'none';
        document.getElementById('question-card').style.borderColor = '#ffd966';
        document.getElementById('question-card').style.boxShadow = '0 15px 35px rgba(0,0,0,0.8)';
    }

    function checkAnswer(selected, btn) {
        if (!canAnswer) return;
        canAnswer = false;
        const isCorrect = selected === correctAnswer;
        total++;
        if (isCorrect) {
            score++;
            playSound('correct');
            btn.classList.add('correct');
            document.getElementById('question-card').style.borderColor = '#4caf50';
            document.getElementById('question-card').style.boxShadow = '0 0 40px #4caf5088';
        } else {
            playSound('wrong');
            btn.classList.add('wrong');
            document.getElementById('question-card').style.borderColor = '#f44336';
            document.getElementById('question-card').style.boxShadow = '0 0 40px #f4433688';
        }
        // Подсветить правильный ответ
        document.querySelectorAll('.option-btn').forEach(b => {
            b.classList.add('disabled');
            if (b.dataset.value === correctAnswer) {
                b.classList.add('correct');
            }
        });
        // Обновить счёт
        document.getElementById('score-board').textContent = `Счёт: ${score} / ${total}`;
        // Показать кнопку "Дальше"
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        if (!canAnswer) {
            // сброс
        }
        generateQuestion();
    }

    // ---------- ОБРАБОТЧИКИ UI ----------
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            currentMode = btn.dataset.mode;
            playSound('click');
            // Сброс счёта при смене режима
            score = 0;
            total = 0;
            document.getElementById('score-board').textContent = `Счёт: 0 / 0`;
            generateQuestion();
        });
    });

    document.getElementById('next-btn').addEventListener('click', () => {
        playSound('click');
        nextQuestion();
    });

    document.getElementById('music-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        musicOn = !musicOn;
        if (musicGain) {
            musicGain.gain.value = musicOn ? 0.08 : 0;
        }
        document.getElementById('music-toggle').textContent = musicOn ? '🎵' : '🔇';
        if (!audioCtx) initAudio();
    });

    document.getElementById('sound-toggle').addEventListener('click', (e) => {
        e.stopPropagation();
        soundOn = !soundOn;
        document.getElementById('sound-toggle').textContent = soundOn ? '🔊' : '🔈';
        if (!audioCtx) initAudio();
    });

    // ---------- АНИМАЦИЯ ----------
    let clock = new THREE.Clock();
    function animate() {
        const delta = clock.getDelta();
        const elapsed = performance.now() * 0.001;

        // Вращение кристалла и колец
        crystal.rotation.y += 0.005;
        crystal.rotation.x = Math.sin(elapsed * 0.5) * 0.2;
        crystal.position.y = 1.5 + Math.sin(elapsed * 1.5) * 0.15;

        ring1.rotation.z += 0.002;
        ring1.rotation.x = Math.PI / 2 + Math.sin(elapsed * 0.8) * 0.1;
        ring2.rotation.y += 0.003;
        ring2.rotation.x = Math.PI / 4 + Math.cos(elapsed * 0.6) * 0.1;

        // Лёгкое движение камеры
        camera.position.x = Math.sin(elapsed * 0.2) * 1.5;
        camera.position.y = 2 + Math.sin(elapsed * 0.3) * 0.3;
        camera.lookAt(0, 1.5, 0);

        // Частицы
        particles.rotation.y += 0.0002;

        renderer.render(scene, camera);
        requestAnimationFrame(animate);
    }

    // ---------- АДАПТАЦИЯ ----------
    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ---------- СТАРТ ----------
    // Сначала инициализируем аудио при первом взаимодействии
    initAudio(); // может быть заблокировано, но мы попробуем
    // Если браузер требует клик, создадим по клику
    if (audioCtx && audioCtx.state === 'suspended') {
        document.body.addEventListener('click', () => { audioCtx.resume(); }, { once: true });
    }

    generateQuestion();
    animate();
    document.getElementById('sound-toggle').textContent = '🔊';
    document.getElementById('music-toggle').textContent = '🎵';
</script>
</body>
</html>
